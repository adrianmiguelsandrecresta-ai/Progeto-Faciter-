<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Faciter - Painel</title><link rel="stylesheet" href="style.css"></head><body><header class="header"><a class="brand" href="index.html"><img src="assets/logo.svg" alt="Faciter"></a><nav class="nav mobile-open"><a href="imoveis.html">Imóveis</a><button id="logout" class="btn btn-light">Sair</button></nav></header><main class="page"><div class="page-heading"><h1>Meu painel</h1><p id="usuario"></p></div><form id="imovelForm" class="form-card wide"><h2>Cadastrar imóvel</h2><div class="grid-form"><input id="titulo" placeholder="Título" required><input id="preco" type="number" step="0.01" placeholder="Preço" required><select id="tipo"><option value="casa">Casa</option><option value="apartamento">Apartamento</option><option value="terreno">Terreno</option><option value="comercial">Comercial</option></select><input id="cidade" placeholder="Cidade" required><input id="estado" maxlength="2" placeholder="UF" required><input id="endereco" placeholder="Endereço" required><input id="quartos" type="number" min="0" placeholder="Quartos"><input id="banheiros" type="number" min="0" placeholder="Banheiros"><textarea id="descricao" placeholder="Descrição" required></textarea></div><button class="btn btn-primary">Cadastrar imóvel</button><p id="msg"></p></form></main><script src="app.js"></script></body></html>
